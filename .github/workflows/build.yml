name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build tools
        run: |
          sdkmanager "platforms;android-19" "build-tools;25.0.3"

      - name: Switch to JDK 8 (for gradle build)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Fix gradle wrapper version
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-3.3-all.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew android:assembleRelease --no-daemon

      - name: Sign APK with debug key
        run: |
          $JAVA_HOME/bin/keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          $JAVA_HOME/bin/jarsigner -verbose \
            -keystore debug.keystore \
            -storepass android -keypass android \
            android/build/outputs/apk/release/android-release-unsigned.apk \
            androiddebugkey
          mv android/build/outputs/apk/release/android-release-unsigned.apk \
             android/build/outputs/apk/release/mario-lua-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mario-lua-signed
          path: android/build/outputs/apk/release/mario-lua-signed.apk

      - name: Sign APK with debug key
        run: |
          $JAVA_HOME/bin/keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          $JAVA_HOME/bin/jarsigner -verbose \
            -keystore debug.keystore \
            -storepass android -keypass android \
            android/build/outputs/apk/release/android-release-unsigned.apk \
            androiddebugkey
          mv android/build/outputs/apk/release/android-release-unsigned.apk \
             android/build/outputs/apk/release/mario-lua-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mario-lua-signed
          path: android/build/outputs/apk/release/mario-lua-signed.apk
